[tool]
id = "com.sublunar.amp"
label = "Amp"
versionCode = 15
versionName = "0.6.2"
orientation = "portrait"
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE",
    "android.permission.WAKE_LOCK",
    # Reading the phone's own music folder, for the Local Music source. On the
    # SDK's allowed list, and requested through LightOS the first time it is used.
    "android.permission.READ_MEDIA_AUDIO",
]
# Official background audio (SDK 0.1.1+): the plugin wires LightAudioService
# and its foreground permissions into this tool's manifest.
capabilities = ["detached-audio"]
# Real LP3 hardware binds to the LightOS system app.
# Use "com.thelightphone.sdk.emulator" for the LightOS emulator instead.
serverPackage = "com.lightos"
