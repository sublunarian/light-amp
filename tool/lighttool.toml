[tool]
id = "com.sublunar.amp"
label = "Amp"
versionCode = 22
versionName = "0.8.2"
orientation = "portrait"
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE",
    "android.permission.WAKE_LOCK",
    # Reading the phone's own music folder, for the Local Music source. On the
    # SDK's allowed list, and requested through LightOS the first time it is used.
    "android.permission.READ_MEDIA_AUDIO",
    # Scanning a username and password from a QR code on the server form, with
    # the SDK's own scanner. On the SDK's allowed list, and asked of the user
    # through LightOS the first time a code is scanned.
    "android.permission.CAMERA",
]
# detached-audio: the plugin wires LightAudioService and its foreground
# permissions into this tool's manifest.
# cleartext-http: a self-hosted server on a home network usually speaks plain
# http://, and without this Android refuses every such request.
capabilities = ["detached-audio", "cleartext-http"]
# Real LP3 hardware binds to the LightOS system app.
# Use "com.thelightphone.sdk.emulator" for the LightOS emulator instead, and
# build with -DlightSdk.allowAltServerPackage=true, which the SDK requires for it.
serverPackage = "com.lightos"
